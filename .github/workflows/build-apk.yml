name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Quality
        run: |
          flutter analyze lib
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CekGrosir-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CekGrosir-APK
          path: build/app/outputs/flutter-apk/CekGrosir-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: CekGrosir v1.0.0 - Production MVP
          body: |
            ### 🛒 CekGrosir - Kalkulator & Estimasi Kulakan Warung
            
            Aplikasi kalkulator daftar belanja grosir warung berbasis Hybrid AI (Gemini REST) + Local Hive Memory.
            
            #### 📦 Cara Unduh & Pasang:
            1. Unduh file **`CekGrosir-release.apk`** di bawah.
            2. Pasang (*install*) pada smartphone Android Anda.
            3. Jika muncul konfirmasi *Install Unknown Apps*, izinkan pemasangan.
            
            #### ✨ Fitur Utama:
            - **Smart Notepad Input:** Mendukung singkatan nota warung (`2R`, `1Ds`, `Lemin besar`, dll).
            - **Hybrid AI + Local Hive Memory:** Otomatis mencocokkan harga dengan database memori lokal warung langganan.
            - **Koreksi Cepat di Kasir:** Tap harga untuk ubah harga toko dan simpan otomatis ke Hive.
            - **Saran Bawa Uang Tunai:** Dibulatkan ke atas ke kelipatan Rp50.000 terdekat (+ buffer 10%).
          files: build/app/outputs/flutter-apk/CekGrosir-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
